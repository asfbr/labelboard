<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Labelboard</title>
<!-- the theme pick, before the settings arrive. No line comment before the closing tag: Apps Script reads past it (build.mjs checks) -->
<script>try { var t = localStorage.getItem('labelboard.theme'); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch (e) {}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,600..800&display=swap" rel="stylesheet">
<style>/*@STYLE@*/</style>
</head>
<body>
<div class="shell is-loading" id="shell">
<header class="top">
  <button type="button" class="brand" id="brand" title="Home"><svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><rect class="mark-stem" x="5" y="3" width="5.5" height="26" rx="1.5"/><path class="mark-tag" fill-rule="evenodd" d="M13 13.5h8.2a1.6 1.6 0 0 1 1.3.7l4.3 6.1a1.4 1.4 0 0 1 0 1.6l-4.3 6.1a1.6 1.6 0 0 1-1.3.7H13a1 1 0 0 1-1-1V14.5a1 1 0 0 1 1-1Zm9.2 7.6a1.9 1.9 0 1 0-3.8 0a1.9 1.9 0 1 0 3.8 0Z"/></svg>Labelboard</button>
  <div class="meta" id="meta"></div>
  <div class="actions">
    <button class="btn ghost" id="btn-refresh" type="button">Read mail again</button>
    <button class="btn primary" id="btn-review" type="button">Review changes</button>
    <button class="btn ghost icon" id="btn-settings" type="button" aria-label="Settings" title="Settings"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
  </div>
</header>

<section class="rack" id="rack" aria-label="Inbox before and after">
  <div class="rack-nums">
    <div class="num"><span class="n" id="n-before">0</span><span class="l">in your inbox now</span></div>
    <div class="num after"><span class="n" id="n-after">0</span><span class="l">stay after you apply</span></div>
    <div class="num quiet"><span class="n" id="n-unsorted">0</span><span class="l">still unsorted</span></div>
    <button class="btn triage-btn" id="btn-triage" type="button" hidden></button>
  </div>
  <div class="progress" id="progress">
    <div class="progress-label" id="progress-label" role="status" aria-live="polite">Opening your board…</div>
    <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
    <button class="btn" id="btn-retry" type="button" hidden>Try again</button>
  </div>
  <div class="rack-bar" id="rack-bar" role="img"></div>
  <p class="rack-key">Each slice is a column, as the board has it. Hatched slices leave the inbox; solid ones stay, labelled.</p>
  <p class="rack-sync" id="rack-sync" aria-live="polite"></p>
</section>

<div class="toolbar">
  <div class="views" id="views" role="tablist" aria-label="Views">
    <button type="button" role="tab" data-view="home">Home</button>
    <button type="button" role="tab" data-view="board">Board</button>
    <button type="button" role="tab" data-view="flow">Flow</button>
    <button type="button" role="tab" data-view="filters">Filters</button>
    <button type="button" role="tab" data-view="overview">Overview</button>
    <button type="button" role="tab" data-view="threads">All threads</button>
    <button type="button" role="tab" data-view="priorities">Priorities</button>
    <button type="button" role="tab" data-view="labels">Labels</button>
  </div>
  <label class="search"><span class="sr">Find a sender</span>
    <input id="q" type="search" placeholder="Find a sender, domain or company" autocomplete="off"></label>
  <label class="check board-only">Show <select id="only-who" class="pick-who">
    <option value="">every card</option><option value="you">placed by you</option><option value="claude">placed by Claude</option><option value="open">suggestions only</option>
  </select></label>
  <label class="check board-only" title="Cards whose mail or filter Gmail doesn't have yet"><input id="only-wait" type="checkbox"> Only what Apply changes</label>
  <span class="hint board-only">Drag a card to another column, or focus it and press Shift + ← →.</span>
</div>
<div class="banner" id="banner" hidden></div>

<main class="board" id="board" aria-label="Columns"></main>
<section class="pane board-only" id="pane" aria-label="Gmail now and after Apply" hidden></section>
<main class="view" id="view" role="tabpanel" hidden></main>
</div>
<div class="tip" id="tip" role="tooltip" hidden></div>

<aside class="drawer" id="drawer" aria-hidden="true" aria-labelledby="dr-title">
  <div class="drawer-head">
    <div><p class="dr-kind" id="dr-kind"></p><h2 id="dr-title"></h2></div>
    <button class="btn ghost icon" id="dr-close" type="button" aria-label="Close"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
  <div class="drawer-body" id="dr-body"></div>
</aside>

<div class="sheet" id="review" role="dialog" aria-modal="true" aria-labelledby="rv-title" hidden>
  <div class="sheet-card">
    <div class="drawer-head"><h2 id="rv-title">Review changes</h2>
      <button class="btn ghost icon" id="rv-close" type="button" aria-label="Close"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <div class="sheet-body" id="rv-body"></div>
  </div>
</div>

<div class="sheet" id="triage" role="dialog" aria-modal="true" aria-labelledby="tr-title" hidden>
  <div class="sheet-card tri-card" tabindex="-1">
    <div class="drawer-head"><div><p class="dr-kind" id="tr-kind"></p><h2 id="tr-title"></h2></div>
      <button class="btn ghost icon" id="tr-close" type="button" aria-label="Close"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <div class="sheet-body" id="tr-body" aria-live="polite"></div>
  </div>
</div>

<div class="sheet" id="settings" role="dialog" aria-modal="true" aria-labelledby="st-title" hidden>
  <div class="sheet-card wide">
    <div class="drawer-head"><h2 id="st-title">Settings</h2>
      <button class="btn ghost icon" id="st-close" type="button" aria-label="Close"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <div class="st-wrap"><nav class="st-nav" id="st-nav" aria-label="Settings sections"></nav><div class="sheet-body st-body" id="st-body"></div></div>
  </div>
</div>

<input type="file" id="import-file" accept="application/json,.json" hidden>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<!-- integrity: the browser refuses a changed file. A new Sortable version needs its new hash (cdnjs lists it). -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.2/Sortable.min.js" integrity="sha512-TelkP3PCMJv+viMWynjKcvLsQzx6dJHvIGhfqzFtZKgAjKM1YPqcwzzDEoTc/BHjf43PcPzTQOjuTr4YdE8lNQ==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script>/*@RULES@*/</script>
<script>/*@INSIGHTS@*/</script>
<script>/*@LABELS@*/</script>
<script>/*@SYNC@*/</script>
<script>/*@PRESETS@*/</script>
<script>/*@ADAPTER@*/</script>
<script>/*@SETTINGS@*/</script>
<script>/*@VIEWS@*/</script>
<script>/*@LABELSVIEW@*/</script>
<script>/*@TRIAGE@*/</script>
<script>/*@HOME@*/</script>
<script>/*@APP@*/</script>
</body>
</html>
