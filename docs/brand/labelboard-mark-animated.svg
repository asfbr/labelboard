<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="128" height="128" role="img" aria-label="Labelboard">
  <!-- Animated mark: an "L" picks up the label tag and becomes "b", then lets go. Still under reduced motion. -->
  <style>
    .ink{fill:#1d2230}.acc{fill:#6247d6}@media (prefers-color-scheme:dark){.ink{fill:#f1efe9}.acc{fill:#a896ff}}
    .tag{animation:merge 4.8s cubic-bezier(.6,0,.2,1) infinite;transform-box:view-box;transform-origin:19px 20px}
    @keyframes merge{0%,12%{transform:translate(5px,-9px) rotate(-18deg)}38%,70%{transform:none}92%,100%{transform:translate(5px,-9px) rotate(-18deg)}}
    @media (prefers-reduced-motion:reduce){.tag{animation:none}}
  </style>
