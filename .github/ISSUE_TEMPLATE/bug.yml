name: Something doesn't work
description: A bug on the board, in a read, or in Apply
body:
  - type: markdown
    attributes:
      value: |
        **Don't paste mail here.** No addresses, subjects, snippets, snapshots or settings files with real contacts: this page is public. Describe it with made-up names (acme.example) instead.
        A security problem goes to *Security → Report a vulnerability*, not here.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to get there
  - type: input
    id: version
    attributes:
      label: Version
      description: The release you installed (v0.0.22), or the commit.
